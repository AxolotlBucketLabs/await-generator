name: CI
on:
  - push
  - pull_request
  - workflow_dispatch
jobs:
  phpunit:
    name: Unit test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version:
          - "8.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@4424c9aab975b57bd706ee5a39c6b4334d6e4f60 # 2.40.0
        with:
          php-version: ${{matrix.php-version}}
          tools: composer
          coverage: xdebug2
      - run: composer config --no-plugins allow-plugins.infection/extension-installer true
      - run: composer update --optimize-autoloader
      - name: phpunit test
        env:
          XDEBUG_MODE: coverage
        run: composer test -- --coverage-clover=coverage.xml
      - uses: codecov/codecov-action@2320916714171c258d01dbd81040d64d798c6f8e # v7.1.1
        with:
          token: ${{secrets.CODECOV_SECRET}}
          fail_ci_if_error: false
  phpstan:
    name: phpstan analyze
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version:
          - "8.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@4424c9aab975b57bd706ee5a39c6b4334d6e4f60 # 2.40.0
        with:
          php-version: ${{matrix.php-version}}
          tools: composer
      - run: composer config --no-plugins allow-plugins.infection/extension-installer true
      - run: composer update --optimize-autoloader
      - name: phpstan analyze
        run: composer analyze
  infection:
    name: Mutation test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version:
          - "8.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@4424c9aab975b57bd706ee5a39c6b4334d6e4f60 # 2.40.0
        with:
          php-version: ${{matrix.php-version}}
          tools: composer
          coverage: xdebug2
      - run: composer config --no-plugins allow-plugins.infection/extension-installer true
      - run: composer update --optimize-autoloader
      - name: infection
        env:
          XDEBUG_MODE: coverage
        run: composer infection
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: infection.log
          path: infection.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: infection-summary.log
          path: infection-summary.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: infection-per-mutator.md
          path: infection-per-mutator.md
